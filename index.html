<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qixi
    </title>
</head>
<body>
<style>
    body { margin: 0; overflow: hidden; background: #000; }

    #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden
    }

    #container canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    #text {
        position: absolute;
        top: 90%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;

        color: white;
        text-align: center;
        pointer-events: none;
    }

</style>

<div id="container">
    <canvas id="canvas"></canvas>

    <div id="text">
        <p id="textBox">hello!</p>
    </div>
</div>

<script src="src/main.js" type="module"></script>

</body>
</html>
